name: Build and Push Docker images

# Build e push delle immagini server/UI su registry.edia.cloud via GitHub Actions
# (evita OOM su Dokploy). Su Dokploy le app sono configurate come "Docker"
# (pull dell'immagine) invece di "build from GitHub".
#
# Trigger manuale dalla tab "Actions". L'input "image" sceglie quale buildare.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Quale immagine buildare"
        type: choice
        default: all
        options:
          - all
          - server
          - ui

env:
  REGISTRY: registry.edia.cloud

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set
        run: |
          all='[
            {"name":"server","image":"context-forge","context":"services/server","dockerfile":"Dockerfile"},
            {"name":"ui","image":"context-forge-ui","context":"services/ui","dockerfile":"Dockerfile"}
          ]'
          sel='${{ github.event.inputs.image }}'
          if [ "$sel" = "all" ]; then
            matrix=$(echo "$all" | jq -c '{include: .}')
          else
            matrix=$(echo "$all" | jq -c --arg s "$sel" '{include: [.[] | select(.name==$s)]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.name == 'server' && 'EMBEDDINGS_PROVIDER=openai' || format('VITE_API_URL={0}', vars.VITE_API_URL) }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
