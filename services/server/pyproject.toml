[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-forge-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # MCP server
    # >=3.2.3 required: older releases' StreamableHTTP transport enabled DNS-rebinding
    # protection by default (Host header allowlist restricted to localhost/127.0.0.1),
    # which rejects every request coming through a reverse proxy with 421 Misdirected
    # Request. 3.2.3+ disables that protection by default (mcp SDK's documented
    # backwards-compat behavior), matching how this server is actually deployed
    # (behind Traefik, terminating at contextapi.edia.cloud).
    "fastmcp>=3.2.3,<4.0.0",

    # REST API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # External data sources (schema context + read-only queries)
    "pymysql>=1.1.0",           # MySQL / MariaDB driver
    "cryptography>=42.0.0",     # credential encryption at rest (Fernet)
    "pyjwt[crypto]>=2.9.0",     # OIDC token validation (JWKS/RS256)
    "sshtunnel>=0.4.0",         # SSH tunnels to data sources behind a bastion
    "paramiko>=3.4,<4",         # sshtunnel 0.4 uses paramiko.DSSKey, removed in paramiko 4+

    # Memory
    "mem0ai>=1.0.11,<2.0.0",

    # Embeddings
    "openai>=1.50.0",
    # sentence-transformers is NOT installed by default (pulls PyTorch ~2GB).
    # Install only when EMBEDDINGS_PROVIDER=local — see Dockerfile.

    # Indexing / code parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-kotlin>=1.1.0",

    # Knowledge base — document text extraction (pure-Python, no system deps)
    "pypdf>=4.2.0",              # PDF
    "python-docx>=1.1.0",       # Word .docx
    "openpyxl>=3.1.0",          # Excel .xlsx/.xlsm
    "xlrd>=2.0.1",              # Excel legacy .xls
    "python-pptx>=0.6.23",      # PowerPoint .pptx
    "striprtf>=0.0.26",         # Rich text .rtf
    "beautifulsoup4>=4.12.0",   # HTML
    "Pillow>=10.0.0",           # image loading for OCR
    "pytesseract>=0.3.10",      # OCR (needs the `tesseract` system binary)

    # Git
    "gitpython>=3.1.40",

    # Scheduling
    "apscheduler>=3.10.4",

    # Metrics
    "prometheus-client>=0.20",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Utils
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
forge-cli = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
