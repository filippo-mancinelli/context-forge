services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: context_forge
      POSTGRES_USER: context_forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_forge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  context-forge:
    build:
      context: ./services/server
      dockerfile: Dockerfile
      args:
        - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
    ports:
      - "4000:4000"
      - "8000:8000"
    # Lets connections configured with `host.docker.internal` reach services
    # published on the host machine (native on Docker Desktop, this mapping
    # makes it work on Linux servers too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://context_forge:${POSTGRES_PASSWORD}@postgres:5432/context_forge
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-text-embedding-3-small}
      - EMBEDDINGS_DIMS=${EMBEDDINGS_DIMS:-1536}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:-}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_URL=${GITLAB_URL:-}
      - SETUP_BOOTSTRAP_TOKEN=${SETUP_BOOTSTRAP_TOKEN:-}
      - SEARCH_HYBRID=${SEARCH_HYBRID:-true}
      - HNSW_MAINTENANCE_WORK_MEM=${HNSW_MAINTENANCE_WORK_MEM:-256MB}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # MCP endpoint auth: disabled | transition | enabled (see .env.example)
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-disabled}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # OIDC login (optional; inert unless OIDC_ENABLED=true)
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-context-forge}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:-}
      - OIDC_GROUP_PREFIX=${OIDC_GROUP_PREFIX:-/mcp-tools/}
      - OIDC_ORG_CLAIM=${OIDC_ORG_CLAIM:-tenant_id}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - PUBLIC_MCP_URL=${PUBLIC_MCP_URL:-}
      - UI_BASE_URL=${UI_BASE_URL:-}
      - MCP_PORT=4000
      - API_PORT=8000
      - REPOS_CACHE_DIR=/data/repos-cache
      - KB_DATA_DIR=/data/kb
      - AGENT_WORKSPACES_DIR=/data/agent-workspaces
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - repos_cache:/data/repos-cache
      - kb_data:/data/kb
      - agent_workspaces:/data/agent-workspaces
      - ./context-forge.yml:/app/context-forge.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        # Empty → same-origin /api, proxied by nginx to the backend below.
        - VITE_API_URL=${VITE_API_URL:-}
    environment:
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-http://context-forge:8000}
    ports:
      - "3000:80"
    depends_on:
      - context-forge
    restart: unless-stopped

volumes:
  postgres_data:
  repos_cache:
  kb_data:
  agent_workspaces:
